services:
  bukar-data-sub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bukar-data-sub-platform
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - APP_NAME=Bukar Data Sub
      - SUPPORT_EMAIL=support@bukardatasub.com
      - DB_PATH=/app/backend/data/platform.sqlite
      - BACKUP_DIR=/app/backend/data/backups
      - JWT_SECRET=${JWT_SECRET:-bukardatasub_super_production_secret_key_2026}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-bds_master_encryption_key_2026_aes}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    volumes:
      - bds-data:/app/backend/data
      - bds-logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  bds-data:
    driver: local
  bds-logs:
    driver: local
